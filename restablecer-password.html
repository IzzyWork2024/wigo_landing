<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0b5b9e" />
  <title>Restablecer contraseña | WIGO</title>
  <link rel="icon" type="image/png" href="assets/sources/icono_go_app.png" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/restablecer-password.css" />
</head>
<body class="reset-page">
  <header class="reset-header">
    <a href="index.html" aria-label="Volver al inicio de WIGO">
      <img src="assets/sources/wigo_slogan.png" alt="WIGO" class="reset-logo" />
    </a>
  </header>

  <main class="reset-main">
    <section class="reset-card" aria-labelledby="resetTitle">
      <span class="reset-eyebrow">Seguridad de la cuenta</span>
      <h1 id="resetTitle">Crea una nueva contraseña</h1>
      <p id="resetMessage">Debe contener al menos 8 caracteres.</p>

      <form id="resetForm" novalidate>
        <label for="password">Nueva contraseña</label>
        <div class="password-field">
          <input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required />
          <button type="button" class="toggle-password" data-target="password" aria-label="Mostrar contraseña">Mostrar</button>
        </div>

        <label for="passwordConfirmation">Confirmar contraseña</label>
        <div class="password-field">
          <input id="passwordConfirmation" name="password_confirmation" type="password" minlength="8" autocomplete="new-password" required />
          <button type="button" class="toggle-password" data-target="passwordConfirmation" aria-label="Mostrar contraseña">Mostrar</button>
        </div>

        <p id="formError" class="form-error" role="alert" hidden></p>
        <button id="submitButton" class="btn reset-submit" type="submit">Restablecer contraseña</button>
      </form>

      <div id="successPanel" hidden>
        <p>Tu contraseña fue actualizada. Las sesiones anteriores se cerraron por seguridad.</p>
        <a class="btn reset-submit" href="https://play.google.com/store/apps/details?id=pe.wigo.app">Volver a WIGO</a>
      </div>
    </section>
  </main>

  <footer class="reset-footer">
    <small>© <span id="year"></span> WIGO. Todos los derechos reservados.</small>
  </footer>

  <script>
    (() => {
      const apiUrl = "https://api.wigo.pe/api/identidad/auth/password/reset";
      const token = new URLSearchParams(window.location.search).get("token") || "";
      const form = document.getElementById("resetForm");
      const error = document.getElementById("formError");
      const submit = document.getElementById("submitButton");
      const title = document.getElementById("resetTitle");
      const message = document.getElementById("resetMessage");

      document.getElementById("year").textContent = new Date().getFullYear();

      if (!/^[A-Za-z0-9]{64}$/.test(token)) {
        form.hidden = true;
        title.textContent = "El enlace no es válido";
        message.textContent = "Solicita un nuevo enlace desde la aplicación WIGO.";
      }

      document.querySelectorAll(".toggle-password").forEach((button) => {
        button.addEventListener("click", () => {
          const input = document.getElementById(button.dataset.target);
          const show = input.type === "password";
          input.type = show ? "text" : "password";
          button.textContent = show ? "Ocultar" : "Mostrar";
          button.setAttribute("aria-label", show ? "Ocultar contraseña" : "Mostrar contraseña");
        });
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        error.hidden = true;
        const password = document.getElementById("password").value;
        const confirmation = document.getElementById("passwordConfirmation").value;

        if (password.length < 8) {
          error.textContent = "La contraseña debe tener al menos 8 caracteres.";
          error.hidden = false;
          return;
        }
        if (password !== confirmation) {
          error.textContent = "Las contraseñas no coinciden.";
          error.hidden = false;
          return;
        }

        submit.disabled = true;
        submit.textContent = "Actualizando…";

        try {
          const response = await fetch(apiUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json", "Accept": "application/json" },
            body: JSON.stringify({ token, password, password_confirmation: confirmation })
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) {
            throw new Error(
              data.errors?.token?.[0] ||
              data.errors?.password?.[0] ||
              data.message ||
              "No se pudo restablecer la contraseña."
            );
          }

          form.hidden = true;
          document.getElementById("successPanel").hidden = false;
          title.textContent = "¡Contraseña actualizada!";
          message.textContent = "Ya puedes iniciar sesión con tu nueva contraseña.";
          history.replaceState(null, "", window.location.pathname);
        } catch (exception) {
          error.textContent = exception.message;
          error.hidden = false;
          submit.disabled = false;
          submit.textContent = "Restablecer contraseña";
        }
      });
    })();
  </script>
</body>
</html>
